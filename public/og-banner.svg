  </text>

  <!-- Pills -->
  <rect x="130" y="440" width="280" height="58" rx="29" fill="#FEF2F2" />
  <text x="270" y="477" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#EA1D2C">
    Promoções do Dia
  </text>

  <rect x="430" y="440" width="310" height="58" rx="29" fill="#F0FDF4" />
  <text x="585" y="477" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#16A34A">
    Economize até 30% no Mês
  </text>

  <rect x="760" y="440" width="300" height="58" rx="29" fill="#F8FAFC" />
  <text x="910" y="477" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#334155">
    GPS em Todo o Brasil
  </text>
</svg>
