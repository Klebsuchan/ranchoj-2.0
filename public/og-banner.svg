<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F6" />
      <stop offset="100%" stop-color="#FFEAE6" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B47" />
      <stop offset="100%" stop-color="#C8101E" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1080" cy="110" r="240" fill="#EA1D2C" fill-opacity="0.07" />
  <circle cx="120" cy="540" r="220" fill="#16A34A" fill-opacity="0.07" />

  <!-- Card Container -->
  <rect x="70" y="65" width="1060" height="500" rx="36" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="3" />

  <!-- Logo Icon -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="110" height="110" rx="28" fill="url(#brandGrad)" />
    <path d="M22 30h12l9.5 39c.6 2.5 2.9 4.5 5.6 4.5h34c2.5 0 4.9-1.7 5.5-4.2L95 43H38" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="49" cy="87" r="6.8" fill="#FFFFFF" />
    <circle cx="78" cy="87" r="6.8" fill="#FFFFFF" />
    <circle cx="88" cy="26" r="19" fill="#16A34A" stroke="#FFFFFF" stroke-width="4.5" />
    <path d="M79.5 26.5l5.3 5.3 10.2-11" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Name -->
  <text x="268" y="198" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="68" font-weight="800" fill="#1E293B">
    Rancho<tspan fill="#EA1D2C">Já</tspan>
  </text>
  <text x="270" y="236" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#16A34A" letter-spacing="1.5">
    OFERTAS DE SUPERMERCADO E ENCARTES HOJE
  </text>

  <!-- Main Headline -->
  <text x="130" y="335" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="44" font-weight="800" fill="#0F172A">
